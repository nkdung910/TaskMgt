<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Task Management App Icon -->
  <g transform="translate(30, 30)">
    <!-- Main Container -->
    <rect x="0" y="0" width="120" height="120" rx="20" fill="currentColor" opacity="0.1"/>
    <rect x="10" y="10" width="100" height="100" rx="15" fill="currentColor" opacity="0.2"/>
    
    <!-- Task Board -->
    <rect x="20" y="20" width="80" height="80" rx="8" fill="currentColor" opacity="0.3"/>
    
    <!-- Task Columns -->
    <rect x="25" y="25" width="20" height="70" rx="3" fill="currentColor" opacity="0.5"/>
    <rect x="50" y="25" width="20" height="70" rx="3" fill="currentColor" opacity="0.4"/>
    <rect x="75" y="25" width="20" height="70" rx="3" fill="currentColor" opacity="0.3"/>
    
    <!-- Task Items -->
    <rect x="27" y="30" width="16" height="12" rx="2" fill="white" opacity="0.9"/>
    <rect x="27" y="45" width="16" height="12" rx="2" fill="white" opacity="0.7"/>
    
    <rect x="52" y="30" width="16" height="12" rx="2" fill="white" opacity="0.8"/>
    <rect x="52" y="45" width="16" height="12" rx="2" fill="white" opacity="0.6"/>
    
    <rect x="77" y="30" width="16" height="12" rx="2" fill="white" opacity="0.7"/>
    
    <!-- Priority Indicators -->
    <circle cx="35" cy="36" r="2" fill="#ef4444"/>
    <circle cx="60" cy="36" r="2" fill="#f59e0b"/>
    <circle cx="85" cy="36" r="2" fill="#10b981"/>
  </g>
</svg>