    <rect x="0" y="0" width="24" height="24" rx="4" fill="currentColor" opacity="0.1"/>
    <rect x="2" y="2" width="20" height="20" rx="2" fill="currentColor" opacity="0.2"/>
    
    <!-- Task Items -->
    <rect x="6" y="6" width="12" height="2" rx="1" fill="currentColor"/>
    <rect x="6" y="10" width="8" height="2" rx="1" fill="currentColor" opacity="0.7"/>
